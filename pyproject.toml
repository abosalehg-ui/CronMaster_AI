[project]
name = "cronmaster-ai"
version = "2.0.0"
description = "مدير ومراقب ذكي لمهام OpenClaw Cron مع إصلاح تلقائي"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
