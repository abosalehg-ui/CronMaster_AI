[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronmaster-ai"
version = "3.2.0"
description = "مدير ومراقب ذكي للمهام المجدولة مع إصلاح تلقائي وسجل تاريخي"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# مصنّف الأخطاء الاختياري — النواة تعمل بدونه بمكتبة Python القياسية فقط
# 0.78 أول نسخة تقبل output_config بحقلَي format وeffort معاً (فُحص على wheels الحزمة)
ai = ["anthropic>=0.78"]
dev = ["pytest", "ruff"]

[project.scripts]
cronmaster = "cronmaster.cli:main"

[tool.setuptools]
packages = [
    "cronmaster",
    "cronmaster.analysis",
    "cronmaster.backends",
    "cronmaster.notifiers",
    "cronmaster.reporting",
]
py-modules = ["CronMaster_AI"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
