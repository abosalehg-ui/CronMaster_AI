name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v
      # النواة يجب أن تعمل بلا أي حزمة طرف ثالث — لم يُثبَّت هنا سوى pytest/ruff
      - name: Stdlib-only smoke test
        run: |
          python3 CronMaster_AI.py --version
          python3 -c "import CronMaster_AI, cronmaster; print(cronmaster.__version__)"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package
        run: pip install .
      - name: Console entry point works
        run: cronmaster --version
